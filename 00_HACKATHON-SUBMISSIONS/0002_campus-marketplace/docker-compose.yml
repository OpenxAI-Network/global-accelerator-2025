services:
  postgres:
    image: postgres:15-alpine
    container_name: campus_marketplace_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    image: campus-marketplace-auth-service
    container_name: campus_marketplace_auth
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://admin:password123@postgres:5432/marketplace
      - PORT=3001
      - JWT_SECRET=a-very-secret-key
    restart: unless-stopped

volumes:
  postgres_data:
